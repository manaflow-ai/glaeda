name: Fleet candidate bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fleet-candidate.yml
      - scripts/fleet_bundle.py
      - scripts/test-fleet-bundle.py
      - scripts/fleet_candidate_receipt.py
      - scripts/test-fleet-candidate-receipt.py
      - scripts/managed_mac_candidate_receipt.py
      - scripts/test-managed-mac-candidate-receipt.py
      - scripts/benchmark-native-runner-log.py
      - scripts/test-benchmark-native-runner-log.py
      - docs/NATIVE_RUNNER_LOG_BENCHMARK.md
      - tests/fleet_bundle_contract.rs
      - scripts/glaeda-disk
      - scripts/test-glaeda-disk.py
      - src/runner_log_reclaim.rs
      - src/runner_log_reclaim_store.rs
      - src/production_recovery_adapter.rs
      - src/bin/glaeda-runner-log-reclaim.rs
      - tests/runner_log_macos.rs
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

# A newer push to the same pull request supersedes its candidate build; dispatches never cancel each other.
concurrency:
  group: fleet-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: "${{ github.repository_owner == 'manaflow-ai' && 'blacksmith-6vcpu-macos-15' || 'macos-15' }}"
            target: aarch64-apple-darwin
          - runner: "${{ github.repository_owner == 'manaflow-ai' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Initialize stable candidate artifact directory
        run: mkdir -p target/fleet-bundles
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Test bundle and receipt verification
        id: bundle_test
        run: |
          python3 scripts/test-fleet-bundle.py
          python3 scripts/test-fleet-candidate-receipt.py
          python3 scripts/test-managed-mac-candidate-receipt.py
          python3 scripts/test-benchmark-native-runner-log.py
      - name: Build exact-source candidate
        id: candidate_build
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/fleet_bundle.py build \
            --source "$(git rev-parse HEAD)" --target "$CANDIDATE_TARGET" \
            --output target/fleet-bundles > "$RUNNER_TEMP/fleet-candidate.json"
          cat "$RUNNER_TEMP/fleet-candidate.json" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/fleet-candidate.json" target/fleet-bundles/receipt.json
      - name: Require exact candidate checkout
        if: ${{ success() && steps.candidate_build.outcome == 'success' }}
        run: |
          python3 scripts/fleet_candidate_receipt.py \
            --candidate-receipt target/fleet-bundles/receipt.json \
            --output "$RUNNER_TEMP/exact-source-receipt.json" \
            --require-exact-source
      - name: Build native runner-log observer (macOS)
        id: native_build
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --release --bin glaeda-runner-log-reclaim \
            --target "$CANDIDATE_TARGET" --target-dir target/fleet-candidate-build
          cp "target/fleet-candidate-build/$CANDIDATE_TARGET/release/glaeda-runner-log-reclaim" \
            target/fleet-bundles/glaeda-runner-log-reclaim
      - name: Build managed Mac admission adapter
        id: admission_build
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --release --lib \
            --target "$CANDIDATE_TARGET" --target-dir target/fleet-candidate-build
          adapter_artifact="$(find "target/fleet-candidate-build/$CANDIDATE_TARGET/release/deps" \
            -type f -name 'libglaeda-*.rlib' -print -quit)"
          test -n "$adapter_artifact"
          cp "$adapter_artifact" target/fleet-bundles/glaeda-managed-admission.rlib
      - name: Run full synthetic receipt-backed admission matrix
        id: admission_matrix
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set +e
          cargo test --locked --release --lib production_recovery_adapter:: \
            --target "$CANDIDATE_TARGET" --target-dir target/fleet-candidate-build \
            -- --test-threads=1 --nocapture 2>&1 | tee target/fleet-bundles/managed-admission-matrix.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Record managed Mac admission receipt
        if: always() && matrix.target == 'aarch64-apple-darwin'
        env:
          REPOSITORY: ${{ github.repository }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET: ${{ matrix.target }}
          ADMISSION_BUILD_OUTCOME: ${{ steps.admission_build.outcome }}
          ADMISSION_MATRIX_OUTCOME: ${{ steps.admission_matrix.outcome }}
          FAILURE_STAGE: managed_mac_admission
          FAILURE_REASON: ${{ steps.admission_build.outcome != 'success' && 'adapter_artifact_missing' || steps.admission_matrix.outcome != 'success' && 'synthetic_matrix_failed' || '' }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/managed_mac_candidate_receipt.py \
            --artifact target/fleet-bundles/glaeda-managed-admission.rlib \
            --output target/fleet-bundles/managed-admission-receipt.json
      - name: Test native runner-log observer (macOS)
        id: native_test
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cargo test --locked --release --lib runner_log_reclaim:: \
            --target "$CANDIDATE_TARGET" --target-dir target/fleet-candidate-build \
            -- --test-threads=1 2>&1 | tee target/fleet-bundles/native-observer-tests.log
          cargo test --locked --release --test runner_log_macos \
            --target "$CANDIDATE_TARGET" --target-dir target/fleet-candidate-build \
            -- --test-threads=1 --nocapture 2>&1 | tee -a target/fleet-bundles/native-observer-tests.log
      - name: Record native observer build and test receipt
        if: ${{ always() && steps.native_build.outcome == 'success' }}
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_OUTCOME: ${{ steps.native_test.outcome }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          binary = pathlib.Path("target/fleet-bundles/glaeda-runner-log-reclaim")
          git = lambda *args: subprocess.check_output(["git", *args], text=True).strip()
          receipt = {
              "document_type": "glaeda-runner-log-reclaim-build-receipt",
              "schema_version": 1,
              "requested_pr_head": os.environ["REQUESTED_HEAD"],
              "checked_out_commit": git("rev-parse", "HEAD"),
              "checked_out_tree": git("rev-parse", "HEAD^{tree}"),
              "target": os.environ["CANDIDATE_TARGET"],
              "toolchain": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "test_outcome": os.environ["TEST_OUTCOME"],
              "test_targets": ["--lib runner_log_reclaim::", "--test runner_log_macos"],
          }
          binary.with_suffix(".receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PYTHON
      - name: Record workflow evidence
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET: ${{ matrix.target }}
          JOB_STATUS: ${{ job.status }}
          BUNDLE_TEST_OUTCOME: ${{ steps.bundle_test.outcome }}
          CANDIDATE_BUILD_OUTCOME: ${{ steps.candidate_build.outcome }}
          NATIVE_BUILD_OUTCOME: ${{ steps.native_build.outcome }}
          NATIVE_TEST_OUTCOME: ${{ steps.native_test.outcome }}
        run: |
          mkdir -p target/fleet-bundles
          python3 scripts/fleet_candidate_receipt.py \
            --candidate-receipt target/fleet-bundles/receipt.json \
            --output target/fleet-bundles/workflow-receipt.json
          cat target/fleet-bundles/workflow-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate and receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glaeda-candidate-${{ matrix.target }}
          path: target/fleet-bundles/
          if-no-files-found: error
          retention-days: 30
